# Example
# https://github.com/mickimnet/myth-prompt-themes/blob/main/colorful/pointed/starship/left_only/starship.toml
#
# ### Performance notes
# Custom modules each cost a process fork for their 'when' check, and another for 'command' if it
# runs. The original layout had 11 separate custom modules (user/hostname/arrow x 4 states), each
# independently evaluating its own 'when' - up to ~13 shell forks per prompt render (2 of the 3
# hostname branches even re-ran the exact same 'uname -n'). This version merges the user+hostname+
# arrow segment for each state into a single custom module: they always shared the same background
# color and sat adjacent with no divider between them, so merging is visually identical output and
# cuts 3 forks down to 1 per state. Worst case is now 4 'when' forks + 1 'command' fork for whichever
# state is active = 5 total, versus ~13 before. $HOSTNAME is read as bash's own auto-populated shell
# parameter rather than exec'ing 'uname'/'hostname', avoiding an extra process on top of the shell.
# - command_timeout/scan_timeout dropped from 10s to 1s: unchanged in the normal case, but bounds
#   how long a hung command/scan can block the prompt.
add_newline = false
command_timeout = 1000
scan_timeout = 1000
palette = "cyber"

format = """
$container\
${custom.dev}\
${custom.ssh}\
${custom.root}\
${custom.normal}\
$directory\
[](fg:color_light_gray bg:color_dark_blue)\
${custom.git_branch}\
$git_status\
[ ](fg:color_dark_blue)\
"""

[palettes.cyber]
color_light_gray = "#606365"
color_light_blue = "#0488D3"
color_dark_blue = "#1c638d"
color_light_red = "#d31f04"
color_light_orange = "#ff7b00"
color_light_yellow = "#daa520"
color_white = "#ffffff"

[container]
style = "bg:#0488D3"
format = '[ $name ]($style)'

# Nix dev shell - static text, single cheap presence-only test
[custom.dev]
when = '[ -n "$IN_NIX_SHELL" ]'
format = "[ nix-shell ](fg:color_white bg:color_light_yellow)[](fg:color_light_yellow bg:color_light_gray)"

# Any ssh user - one shell fork for 'when', a second only when this state is the active one
[custom.ssh]
when = '[ -z "$IN_NIX_SHELL" ] && [ -n "$SSH_CONNECTION" ]'
command = 'echo "$USER@$HOSTNAME"'
shell = ["bash", "--noprofile", "--norc"]
format = "[ $output ](fg:color_white bg:color_light_orange)[](fg:color_light_orange bg:color_light_gray)"

# Non ssh user and root
[custom.root]
when = '[ -z "$IN_NIX_SHELL" ] && [ -z "$SSH_CONNECTION" ] && [ "$USER" = "root" ]'
command = 'echo "root@$HOSTNAME"'
shell = ["bash", "--noprofile", "--norc"]
format = "[ $output ](fg:color_white bg:color_light_red)[](fg:color_light_red bg:color_light_gray)"

# Non ssh user and not root
[custom.normal]
when = '[ -z "$IN_NIX_SHELL" ] && [ -z "$SSH_CONNECTION" ] && [ "$USER" != "root" ]'
command = 'echo "$USER@$HOSTNAME"'
shell = ["bash", "--noprofile", "--norc"]
format = "[ $output ](fg:color_white bg:color_light_blue)[](fg:color_light_blue bg:color_light_gray)"

[directory]
format = "[ $path ](fg:color_white bg:color_light_gray)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

# Same icon+name segment as git_branch, but suppresses the branch name when it
# duplicates the worktree directory name (e.g. `git worktree add ../foo foo`),
# which would otherwise echo the name back-to-back.
[custom.git_branch]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = '''
name=$(git branch --show-current 2>/dev/null)
if [ -n "$name" ] && [ "$name" != "$(basename "$PWD")" ]; then
  printf " \xef\x90\x98 %s" "$name"
else
  printf " \xef\x90\x98"
fi
'''
shell = ["bash", "--noprofile", "--norc"]
format = '[$output ](fg:color_white bg:color_dark_blue)'

[git_status]
ahead = '⇡ ${count}'
behind = '⇣ ${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[$all_status$ahead_behind ](fg:color_white bg:color_dark_blue)'
